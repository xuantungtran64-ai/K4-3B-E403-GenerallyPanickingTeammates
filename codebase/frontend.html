<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Q&A Radar - Enterprise Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .tax-ADMIN { background: #475569; color: #f1f5f9; } /* Xám */
        .tax-RECALL { background: #0284c7; color: #f0f9ff; } /* Xanh dương */
        .tax-COMPREHEND { background: #16a34a; color: #f0fdf4; } /* Xanh lá */
        .tax-APPLY { background: #ea580c; color: #fff7ed; } /* Cam */
        .tax-CRITICAL { background: #dc2626; color: #fef2f2; } /* Đỏ */
        .tax-Unclassified { background: #334155; color: #cbd5e1; }
        
        .pulse { animation: pulse-anim 2s infinite; }
        @keyframes pulse-anim { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 selection:bg-blue-500 selection:text-white">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 glass-panel p-6 rounded-2xl shadow-2xl">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent flex items-center gap-3">
                    <i class="fa-solid fa-radar text-blue-400"></i>Live Q&A Radar
                </h1>
                <p class="text-slate-400 mt-2 text-sm font-medium">Hệ thống Phân tích & Xếp hạng câu hỏi Thời gian thực</p>
            </div>
            <div class="mt-4 md:mt-0 text-right">
                <div class="inline-flex items-center bg-slate-900 px-5 py-2 rounded-full border border-slate-700 shadow-inner">
                    <div class="w-3 h-3 rounded-full bg-emerald-500 mr-3 pulse shadow-[0_0_10px_#10b981]"></div>
                    <span class="font-mono text-2xl font-bold text-emerald-400 tracking-wider" id="sim-time">--:--:--</span>
                </div>
                <p class="text-slate-500 text-xs mt-2 uppercase tracking-widest font-bold">Simulated Livestream Time</p>
            </div>
        </header>

        <!-- Main Content -->
        <main>
            <div class="flex justify-between items-end mb-6 px-2">
                <h2 class="text-xl font-bold text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-fire text-orange-500"></i> Bảng Phong Thần (Top 5)
                </h2>
                <div class="flex items-center gap-2 text-xs font-mono text-slate-400 bg-slate-800 px-3 py-1 rounded-md border border-slate-700">
                    <i class="fa-solid fa-rotate animate-spin" style="animation-duration: 2s;"></i>
                    <span id="last-update">Syncing...</span>
                </div>
            </div>

            <div id="questions-container" class="space-y-5">
                <!-- Loading State -->
                <div class="text-center py-32 text-slate-500 glass-panel rounded-2xl border-dashed">
                    <i class="fa-solid fa-satellite-dish text-5xl mb-6 text-slate-600 pulse"></i>
                    <p class="text-lg font-medium">Đang kết nối đến AI Core...</p>
                    <p class="text-sm mt-2">Vui lòng đảm bảo Server FastAPI đang chạy.</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';

        async function fetchQuestions() {
            try {
                const res = await fetch(`${API_BASE}/top-questions`);
                if (!res.ok) throw new Error("Server response not ok");
                const data = await res.json();
                
                document.getElementById('sim-time').innerText = data.time_hien_tai;
                
                const container = document.getElementById('questions-container');
                if (!data.top_5 || data.top_5.length === 0) {
                    container.innerHTML = `
                        <div class="glass-panel p-16 rounded-2xl text-center text-slate-400 border-dashed">
                            <i class="fa-solid fa-mug-hot text-5xl mb-4 text-slate-600"></i>
                            <p class="text-xl font-semibold">Tất cả câu hỏi đã được giải quyết!</p>
                            <p class="text-sm mt-2">Giảng viên có thể yên tâm giảng bài tiếp.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = data.top_5.map((q, index) => `
                    <div class="glass-panel rounded-2xl p-6 transition-all duration-300 hover:border-slate-400 hover:shadow-[0_0_20px_rgba(56,189,248,0.15)] flex flex-col md:flex-row gap-6 items-start md:items-center group">
                        
                        <!-- Rank & Score Badge -->
                        <div class="flex flex-col items-center justify-center bg-slate-900 rounded-xl p-4 w-full md:w-32 border border-slate-700 shadow-inner shrink-0">
                            <span class="text-[10px] font-extrabold text-slate-500 uppercase tracking-widest mb-1">Rank #${index + 1}</span>
                            <span class="text-3xl font-black text-white tracking-tighter">${q.score.toFixed(1)}</span>
                            <span class="text-[9px] text-slate-600 mt-1 font-bold">Z-SCORE</span>
                        </div>

                        <!-- Question Info -->
                        <div class="flex-1 w-full">
                            <div class="flex flex-wrap items-center gap-2 mb-3">
                                <span class="px-3 py-1 text-[10px] font-bold rounded-full uppercase tracking-widest shadow-sm tax-${q.taxonomy_level}">
                                    <i class="fa-solid fa-microchip mr-1.5 opacity-70"></i>${q.taxonomy_level}
                                </span>
                                <span class="text-[11px] font-medium text-slate-300 bg-slate-800 px-3 py-1 rounded-full border border-slate-700 flex items-center">
                                    <i class="fa-solid fa-users mr-1.5 text-slate-500"></i>${q.count} người cùng thắc mắc
                                </span>
                            </div>
                            <h3 class="text-xl font-medium text-slate-100 leading-relaxed">"${q.text}"</h3>
                        </div>

                        <!-- Actions -->
                        <div class="flex flex-row md:flex-col gap-3 w-full md:w-auto shrink-0 mt-4 md:mt-0">
                            <button onclick="handleAction('remove', ${index})" class="flex-1 md:flex-none flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3 rounded-xl font-semibold transition-all shadow-[0_0_15px_rgba(5,150,105,0.4)] hover:shadow-[0_0_20px_rgba(16,185,129,0.6)] hover:-translate-y-0.5 active:translate-y-0">
                                <i class="fa-solid fa-check text-lg"></i>
                                <span>Đã Trả Lời</span>
                            </button>
                            <button onclick="handleAction('send-ta', ${index})" class="flex-1 md:flex-none flex items-center justify-center gap-2 bg-slate-700 hover:bg-slate-600 text-slate-200 px-5 py-3 rounded-xl font-semibold border border-slate-600 transition-all hover:-translate-y-0.5 active:translate-y-0">
                                <i class="fa-solid fa-paper-plane opacity-70"></i>
                                <span>Gửi TA</span>
                            </button>
                        </div>
                    </div>
                `).join('');

                const now = new Date();
                document.getElementById('last-update').innerText = `Ping: ${now.toLocaleTimeString()}`;

            } catch (err) {
                console.error("Lỗi kết nối:", err);
            }
        }

        async function handleAction(action, index) {
            try {
                const res = await fetch(`${API_BASE}/action/${action}/${index}`, { method: 'POST' });
                const result = await res.json();
                if (result.status === 'success') {
                    // Refresh UI immediately to feel responsive
                    fetchQuestions();
                }
            } catch (err) {
                alert("Mất kết nối tới AI Core! Hãy kiểm tra lại Server Python.");
            }
        }

        // Fetch continuously every 2 seconds
        setInterval(fetchQuestions, 2000);
        fetchQuestions(); // Initial load
    </script>
</body>
</html>
